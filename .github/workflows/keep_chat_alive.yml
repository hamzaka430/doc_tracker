name: Keep Chat DB Alive

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-chat-db:
    name: Ping Aiven Chat Database & App
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Heartbeat to Chat DB Keep-Alive Endpoint
        run: |
          echo "Starting heartbeat ping to Chat DB..."
          TARGET_URL="https://doctracking-3064bacd0985.herokuapp.com/api/chat-db-keepalive"
          
          # Ping the endpoint with up to 3 retries
          RESPONSE=$(curl -fsSL -X GET "$TARGET_URL" \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            -H "User-Agent: GitHub-Actions-ChatDB-Keepalive")
          
          echo "Server Response:"
          echo "$RESPONSE"
          
          # Verify response contains status success
          if echo "$RESPONSE" | grep -q '"status":"success"'; then
            echo "✅ Chat Database is active and healthy! Inactivity power-off prevented."
          else
            echo "❌ Unexpected response received from server:"
            echo "$RESPONSE"
            exit 1
          fi
